name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action reads `packageManager` from
      # package.json, which is the same field pnpm itself enforces at runtime,
      # so CI and a contributor's laptop cannot drift apart. Naming a version
      # here as well is a hard error ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck every package
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build the client
        run: pnpm --filter @websino/web build
